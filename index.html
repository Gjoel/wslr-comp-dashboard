<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSLR Competitor Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .wslr-row { background-color: #ecfdf5; }
    .cheapest { background-color: #d1fae5; }
    .most-expensive { color: #b91c1c; }
    .na { color: #9ca3af; font-style: italic; }
    .rate-cell .room { font-size: 11px; color: #64748b; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">

    <header class="mb-8 flex items-start justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">WSLR Competitor Tracker</h1>
        <p class="text-sm text-slate-500 mt-1" id="lastUpdated">Loading…</p>
      </div>
      <div class="flex gap-2">
        <button id="btnPerNight" class="px-4 py-2 rounded-md font-medium text-sm bg-slate-900 text-white">Per night</button>
        <button id="btnTotal"    class="px-4 py-2 rounded-md font-medium text-sm bg-white border border-slate-300 text-slate-700">Stay total</button>
      </div>
    </header>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="statCards"></div>

    <div class="bg-white rounded-lg shadow-sm border border-slate-200">
      <div class="px-6 py-4 border-b border-slate-200">
        <h2 class="text-lg font-semibold">Upcoming date snapshot</h2>
        <p class="text-sm text-slate-500 mt-1">Cheapest room per property per date. Room name shown beneath each rate.</p>
      </div>
      <div class="overflow-x-auto p-6">
        <table class="w-full text-sm" id="snapshotTable"></table>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-slate-200 mt-8">
      <div class="px-6 py-4 border-b border-slate-200">
        <h2 class="text-lg font-semibold">Rate comparison by date</h2>
        <p class="text-sm text-slate-500 mt-1">Each bar group shows one date; bars within a group are the properties.</p>
      </div>
      <div class="p-6">
        <canvas id="rateChart" height="120"></canvas>
      </div>
    </div>

    <footer class="text-center text-xs text-slate-400 mt-8 pb-8">
      Data scraped weekly from booking.com · WSLR internal tool
    </footer>
  </div>

  <script>
    // ====== CONFIG ======
    const SUPABASE_URL = '__SUPABASE_URL__';
    const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
    const WSLR_PROPERTY = 'WSLR (us)';
    const PROPERTY_ORDER = [
      'WSLR (us)',
      'Novotel Wollongong',
      'Quality Suites Pioneer Sands',
      'Sage Hotel Wollongong',
      'Corrimal Beach Tourist Park',
    ];
    // ====================

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let unit = 'perNight';
    let allRows = [];
    let chart = null;

    function fmtAUD(n) {
      if (n == null) return '<span class="na">—</span>';
      return 'AU$' + Math.round(n);
    }
    function fmtDate(s) {
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    function nightsBetween(checkIn, checkOut) {
      return (new Date(checkOut) - new Date(checkIn)) / 86400000;
    }
    function displayRate(perNightRate, checkIn, checkOut) {
      if (perNightRate == null) return null;
      if (unit === 'perNight') return perNightRate;
      return perNightRate * nightsBetween(checkIn, checkOut);
    }

    async function load() {
      const since = new Date(Date.now() - 30 * 86400000).toISOString();
      const { data, error } = await sb
        .from('competitor_room_rates')
        .select('*')
        .gte('scraped_at', since)
        .order('scraped_at', { ascending: false });
      if (error) {
        document.getElementById('lastUpdated').textContent = 'Error loading: ' + error.message;
        console.error(error);
        return;
      }
      allRows = data || [];
      render();
    }

    function render() {
      // For each (property, check_in), find the most recent scrape_run_id
      const latestRunPerKey = {};
      for (const r of allRows) {
        const k = r.property + '|' + r.check_in;
        if (!latestRunPerKey[k] || r.scraped_at > latestRunPerKey[k].scraped_at) {
          latestRunPerKey[k] = { run: r.scrape_run_id, scraped_at: r.scraped_at };
        }
      }

      // Keep only rows from the most recent run for each (property, check_in)
      const current = allRows.filter(r => {
        const k = r.property + '|' + r.check_in;
        return latestRunPerKey[k] && latestRunPerKey[k].run === r.scrape_run_id;
      });

      // Pick the cheapest room per (property, check_in)
      const cheapest = {};
      for (const r of current) {
        const k = r.property + '|' + r.check_in;
        if (r.rate == null) {
          if (!cheapest[k]) cheapest[k] = r; // keep error/unavailable record if no rate found yet
          continue;
        }
        if (!cheapest[k] || cheapest[k].rate == null || r.rate < cheapest[k].rate) {
          cheapest[k] = r;
        }
      }

      // Group by check_in
      const byDate = {};
      for (const r of Object.values(cheapest)) {
        if (!byDate[r.check_in]) byDate[r.check_in] = {
          check_in: r.check_in,
          check_out: r.check_out,
          stayType: r.notes?.match(/stay_type=(\w+)/)?.[1] || '',
          props: {},
        };
        byDate[r.check_in].props[r.property] = r;
      }
      const dates = Object.values(byDate).sort((a, b) => a.check_in.localeCompare(b.check_in));

      renderHeader(current);
      renderStats(dates);
      renderTable(dates);
      renderChart(dates);
    }

    function renderHeader(rows) {
      if (rows.length === 0) {
        document.getElementById('lastUpdated').textContent = 'No data yet — run the scraper to populate the table.';
        return;
      }
      const latestScrape = rows.reduce((max, r) => r.scraped_at > max ? r.scraped_at : max, rows[0].scraped_at);
      const d = new Date(latestScrape);
      document.getElementById('lastUpdated').textContent = 'Last scrape: ' + d.toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function renderStats(dates) {
      let cheapest = 0, expensive = 0, mid = 0, total = 0;
      let wslrSum = 0, wslrCount = 0;
      let compSum = 0, compCount = 0;

      for (const d of dates) {
        const wslr = d.props[WSLR_PROPERTY];
        const others = PROPERTY_ORDER.filter(p => p !== WSLR_PROPERTY)
          .map(p => d.props[p])
          .filter(r => r && r.rate != null);
        if (!wslr || wslr.rate == null) continue;
        total++;
        const w = displayRate(wslr.rate, d.check_in, d.check_out);
        wslrSum += w; wslrCount++;
        const otherRates = others.map(r => displayRate(r.rate, d.check_in, d.check_out));
        otherRates.forEach(r => { compSum += r; compCount++; });
        const cheaperThan = otherRates.filter(r => w < r).length;
        if (cheaperThan === otherRates.length) cheapest++;
        else if (cheaperThan === 0) expensive++;
        else mid++;
      }

      const wslrAvg = wslrCount ? wslrSum / wslrCount : null;
      const compAvg = compCount ? compSum / compCount : null;
      const diff = (wslrAvg && compAvg) ? ((wslrAvg - compAvg) / compAvg * 100) : null;

      const cards = [
        { label: 'WSLR avg', value: wslrAvg != null ? 'AU$' + Math.round(wslrAvg) : '—', sub: unit === 'perNight' ? 'per night' : 'stay total' },
        { label: 'Competitor avg', value: compAvg != null ? 'AU$' + Math.round(compAvg) : '—', sub: 'across all upcoming dates' },
        { label: 'WSLR vs competitors', value: diff != null ? (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%' : '—', sub: diff != null && diff < 0 ? 'cheaper on avg' : 'more expensive', cls: diff != null && diff < 0 ? 'text-emerald-600' : 'text-rose-600' },
        { label: 'Cheapest in market', value: cheapest + '/' + total, sub: 'dates where WSLR wins' },
      ];

      document.getElementById('statCards').innerHTML = cards.map(c => `
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
          <div class="text-xs uppercase tracking-wide text-slate-500">${c.label}</div>
          <div class="text-2xl font-bold mt-2 ${c.cls || ''}">${c.value}</div>
          <div class="text-xs text-slate-500 mt-1">${c.sub}</div>
        </div>
      `).join('');
    }

    function renderTable(dates) {
      const t = document.getElementById('snapshotTable');
      const headers = ['Date', 'Stay', ...PROPERTY_ORDER];

      const rows = dates.map(d => {
        const ratesForRow = PROPERTY_ORDER.map(p => {
          const r = d.props[p];
          return { prop: p, rec: r, displayed: r ? displayRate(r.rate, d.check_in, d.check_out) : null };
        });
        const valid = ratesForRow.filter(x => x.displayed != null).map(x => x.displayed);
        const min = valid.length ? Math.min(...valid) : null;
        const max = valid.length ? Math.max(...valid) : null;

        const cells = ratesForRow.map(({ prop, rec, displayed }) => {
          let cls = 'rate-cell text-right py-2 px-3 align-top';
          if (displayed != null && valid.length > 1) {
            if (displayed === min) cls += ' cheapest';
            else if (displayed === max) cls += ' most-expensive';
          }
          if (!rec) return `<td class="${cls}">${fmtAUD(null)}</td>`;
          if (rec.rate == null) {
            const reason = rec.room_name?.replace(/[()]/g, '') || 'unavailable';
            return `<td class="${cls}"><span class="na">${reason}</span></td>`;
          }
          return `<td class="${cls}">
            <div class="font-semibold">${fmtAUD(displayed)}</div>
            <div class="room" title="${rec.room_name}">${rec.room_name}</div>
          </td>`;
        }).join('');

        return `<tr class="${d.props[WSLR_PROPERTY] ? 'wslr-row' : ''} border-t border-slate-100">
          <td class="py-2 px-3 font-medium align-top">${fmtDate(d.check_in)}</td>
          <td class="py-2 px-3 text-slate-500 capitalize align-top">${d.stayType}</td>
          ${cells}
        </tr>`;
      }).join('');

      t.innerHTML = `
        <thead>
          <tr class="text-left text-xs uppercase tracking-wide text-slate-500 border-b border-slate-200">
            ${headers.map((h, i) => `<th class="py-2 px-3 ${i >= 2 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      `;
    }

    function renderChart(dates) {
      const ctx = document.getElementById('rateChart').getContext('2d');
      const labels = dates.map(d => fmtDate(d.check_in));
      const palette = ['#10b981', '#6366f1', '#f59e0b', '#ef4444', '#0891b2'];
      const datasets = PROPERTY_ORDER.map((p, i) => ({
        label: p,
        data: dates.map(d => {
          const r = d.props[p];
          return r ? displayRate(r.rate, d.check_in, d.check_out) : null;
        }),
        backgroundColor: palette[i % palette.length],
        borderRadius: 4,
      }));
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            tooltip: { callbacks: { label: c => c.dataset.label + ': AU$' + (c.parsed.y != null ? Math.round(c.parsed.y) : '—') } },
          },
          scales: { y: { beginAtZero: false, ticks: { callback: v => 'AU$' + v } } },
        },
      });
    }

    function setUnit(u) {
      unit = u;
      document.getElementById('btnPerNight').className = 'px-4 py-2 rounded-md font-medium text-sm ' + (u === 'perNight' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-300 text-slate-700');
      document.getElementById('btnTotal').className = 'px-4 py-2 rounded-md font-medium text-sm ' + (u === 'total' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-300 text-slate-700');
      render();
    }

    document.getElementById('btnPerNight').addEventListener('click', () => setUnit('perNight'));
    document.getElementById('btnTotal').addEventListener('click', () => setUnit('total'));

    load();
  </script>
</body>
</html>
